buildscript {
    repositories {
        mavenCentral()
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.neoforged.net/releases" }
    }
}

plugins {
    id 'dev.architectury.loom' version '1.7.435'
    id 'maven-publish'
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.neoforged.net/releases" }
}

processResources {
    inputs.property "version", project.version
    filesMatching(["META-INF/neoforge.mods.toml", "META-INF/neoforge.loader.mods.toml"]) {
        expand "version": project.version
    }
}

loom {
    accessWidenerPath = file("src/main/resources/voxy.accesswidener")
}

configurations {
    bundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.deprecation = true
}

compileJava.doLast {
    sourceSets.main.output.classesDirs.each { dir ->
        def classFile = new File(dir, "me/cortex/voxy/client/config/VoxyConfig.class")
        if (classFile.exists()) {
            println "Transforming ${classFile} to add int sectionRenderDistance for SeedGen compat..."
            def cr = new org.objectweb.asm.ClassReader(classFile.bytes)
            def cw = new org.objectweb.asm.ClassWriter(cr, 0)
            def cv = new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9, cw) {
                @Override
                void visitEnd() {
                    def fv = cv.visitField(
                        org.objectweb.asm.Opcodes.ACC_PUBLIC | org.objectweb.asm.Opcodes.ACC_TRANSIENT,
                        "sectionRenderDistance",
                        "I",
                        null,
                        null
                    )
                    if (fv != null) {
                        fv.visitEnd()
                    }
                    super.visitEnd()
                }
            }
            cr.accept(cv, 0)
            classFile.bytes = cw.toByteArray()
            println "Successfully added transient int sectionRenderDistance to VoxyConfig.class"
        }
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

dependencies {
    // Minecraft and mappings
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    // Sodium for NeoForge (required dependency)
    modCompileOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
    modRuntimeOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"

    // Optional: Iris shaders support
    modCompileOnly("maven.modrinth:iris:1.8.0+1.21.1-neoforge")

    // Optional: Lithium support (for LithiumHashPalette compatibility)
    modCompileOnly("maven.modrinth:lithium:mc1.21.1-0.15.0-neoforge")

    // Optional: Nvidium support
    //modCompileOnly "maven.modrinth:nvidium:0.3.0-beta"
}

shadowJar {
    exclude "fabric.mod.json"
    configurations = [project.configurations.bundle]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

project.ext.lwjglVersion = "3.3.3"
project.ext.lwjglNatives = "natives-windows"

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    forgeRuntimeLibrary "org.lwjgl:lwjgl"
    bundle(implementation("org.lwjgl:lwjgl-lmdb")) { transitive = false }
    forgeRuntimeLibrary "org.lwjgl:lwjgl-lmdb"

    forgeRuntimeLibrary "org.lwjgl:lwjgl:$lwjglVersion:natives-windows"
    forgeRuntimeLibrary "org.lwjgl:lwjgl:$lwjglVersion:natives-linux"
    bundle(forgeRuntimeLibrary("org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows")) { transitive = false }
    bundle(forgeRuntimeLibrary("org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux")) { transitive = false }
    bundle(forgeRuntimeLibrary("org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux-arm64")) { transitive = false }

    bundle(implementation("com.github.luben:zstd-jni:1.5.6-3")) { transitive = false }

    // Storage backends
    bundle(implementation('org.rocksdb:rocksdbjni:8.10.0')) { transitive = false }
    forgeRuntimeLibrary 'org.rocksdb:rocksdbjni:8.10.0'
    bundle(implementation('redis.clients:jedis:5.1.0')) { transitive = false }
    forgeRuntimeLibrary 'redis.clients:jedis:5.1.0'
    bundle(implementation('org.apache.commons:commons-pool2:2.12.0')) { transitive = false }
    forgeRuntimeLibrary 'org.apache.commons:commons-pool2:2.12.0'
    // LZ4 is provided by Minecraft/NeoForge, do not bundle
    compileOnly 'org.lz4:lz4-java:1.8.0'
    bundle(implementation('org.tukaani:xz:1.10')) { transitive = false }
    forgeRuntimeLibrary 'org.tukaani:xz:1.10'
}

def originalVoxyJar = project.hasProperty('originalVoxyJar') ?
        file(project.property('originalVoxyJar')) :
        file("${projectDir}/libs/voxy-fabric-0.2.20-beta.jar")

tasks.register('downloadOfficialVoxy') {
    group = 'build'
    description = 'Downloads the official unmodified Fabric Voxy JAR from Modrinth CDN if not present.'
    outputs.file(originalVoxyJar)
    doLast {
        if (!originalVoxyJar.exists()) {
            originalVoxyJar.parentFile.mkdirs()
            println "Downloading official Fabric Voxy (0.2.20-beta) from Modrinth CDN..."
            def url = new URI("https://cdn.modrinth.com/data/fxxUqruK/versions/iIrM8ZKQ/voxy-0.2.20-beta.jar").toURL()
            url.withInputStream { ins ->
                originalVoxyJar.withOutputStream { outs ->
                    outs << ins
                }
            }
            println "Successfully downloaded official Fabric Voxy to ${originalVoxyJar}"
        }
    }
}

tasks.register('generateVoxyPatches', JavaExec) {
    group = 'build'
    description = 'Generates binary delta patches and additions comparing official Fabric Voxy with compiled NeoForge Voxy.'
    dependsOn remapJar, downloadOfficialVoxy

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.dripps.voxy.locator.VoxyDiffGenerator'

    args = [
        originalVoxyJar.absolutePath,
        remapJar.archiveFile.get().asFile.absolutePath,
        file("src/generated/resources").absolutePath,
        project.version.toString()
    ]
}

tasks.register('buildDistributableJar', Jar) {
    group = 'build'
    description = 'Builds the clean legal distributable NeoForge JAR containing only the IDependencyLocator, patches, and additions.'
    dependsOn generateVoxyPatches

    archiveClassifier = 'distributable'
    destinationDirectory = file("${buildDir}/libs")

    // 1. Include only runtime loader/locator classes (exclude raw me.cortex.voxy classes)
    from(sourceSets.main.output) {
        include 'com/dripps/voxy/locator/**'
        include 'META-INF/services/net.neoforged.neoforgespi.locating.IDependencyLocator'
        include 'META-INF/neoforge.loader.mods.toml'
        rename { String fileName ->
            fileName == 'neoforge.loader.mods.toml' ? 'neoforge.mods.toml' : fileName
        }
    }

    // 2. Include generated binary patches and additions pack (avoids JPMS package scanning issues)
    from(file("src/generated/resources")) {
        include 'voxy_patches/**'
    }

    // 3. Strict Legal Verification Step
    doLast {
        def jarFile = archiveFile.get().asFile
        def origJar = originalVoxyJar

        println "=================================================="
        println " Verifying Distributable JAR: ${jarFile.name}     "
        println "=================================================="

        def origEntries = new HashSet<String>()
        new java.util.zip.ZipFile(origJar).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.directory) origEntries.add(entry.name)
            }
        }

        int totalEntries = 0
        int patchFiles = 0
        int locatorClasses = 0
        boolean hasAdditionsPack = false

        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.directory) return
                totalEntries++
                def name = entry.name

                // Check 1: Root classes must ONLY be locator classes
                if (name.endsWith('.class')) {
                    if (!name.startsWith('com/dripps/voxy/locator/')) {
                        throw new GradleException("LEGAL VIOLATION: Disallowed raw class bundled at root: " + name)
                    }
                    locatorClasses++
                }

                if (name.startsWith('voxy_patches/')) {
                    if (name.endsWith('voxy_additions.pack')) {
                        hasAdditionsPack = true
                    } else {
                        patchFiles++
                    }
                }
            }
        }

        if (!hasAdditionsPack) {
            throw new GradleException("voxy_additions.pack is missing from distributable jar!")
        }

        println "Verification PASSED:"
        println "  Total entries:     ${totalEntries}"
        println "  Locator classes:   ${locatorClasses}"
        println "  Delta patch files: ${patchFiles}"
        println "  Additions pack:    PRESENT (voxy_additions.pack)"
        println "  Original raw .class files: ZERO (0)"
        println "=================================================="
    }
}
